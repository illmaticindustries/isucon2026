# asia2: 2 vCPU, 3.7GB RAM, SSD. Installed by `make pg-tune` (reloads; restarts only if needed).
# Durability settings (fsync, synchronous_commit, full_page_writes) are intentionally left at their defaults.

shared_buffers = 1GB
effective_cache_size = 2560MB
work_mem = 8MB
maintenance_work_mem = 256MB

# SSD
random_page_cost = 1.1
effective_io_concurrency = 200

# Most checkpoints were forced by WAL volume (image bytea writes) at max_wal_size = 1GB.
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min
wal_buffers = -1

# Backends wrote ~66k dirty buffers themselves in one benchmark (buffers_backend);
# let the background writer clean ahead of them.
bgwriter_delay = 50ms
bgwriter_lru_maxpages = 1000
bgwriter_lru_multiplier = 4.0

# Short OLTP queries; JIT compilation costs more than it saves.
jit = off
