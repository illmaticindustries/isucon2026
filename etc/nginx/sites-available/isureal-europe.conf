upstream isureal_europe_image_origin {
  server 192.168.1.10:8091;
  keepalive 32;
}

upstream isureal_europe_backend {
  server 192.168.1.10:8081;
  keepalive 32;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  # SSE: the app sends nothing until a notification is ready, so do not time out or buffer.
  location = /api/notifications {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_pass http://isureal_europe_backend;
  }

  location ^~ /api/images/ {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Isureal-Image-Accel "";
    proxy_ignore_headers X-Accel-Redirect;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_pass http://isureal_europe_image_origin;
  }

  location ^~ /_isureal_image_files/ { return 404; }

  location /api/ {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_pass http://isureal_europe_backend;
  }

  location / {
    try_files $uri /index.html;
  }
}
