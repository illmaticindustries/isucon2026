upstream isureal_regional_backend {
  server 192.168.1.10:8081;
  keepalive 32;
}

upstream isureal_backend {
  server 127.0.0.1:8080;
  keepalive 64;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  # SSE: the app sends nothing until a notification is ready, so do not time out or buffer.
  location = /api/notifications {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_pass http://isureal_backend;
  }

  location ^~ /api/images/ {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Isureal-Image-Accel v1;
    proxy_pass http://isureal_backend;
  }

  location ^~ /_isureal_image_files/ {
    internal;
    alias /home/isucon/.isureal-image-files/;
    etag off;
    if_modified_since off;
    max_ranges 0;
    add_header Cache-Control no-store always;
    error_page 404 = @image_file_missing;
  }

  # A reset or file loss between the app's stat and nginx's open rechecks
  # the original signed request in Go and returns the authoritative bytes.
  location @image_file_missing {
    if ($request_uri !~ "^/api/images/") { return 404; }
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Isureal-Image-Accel "";
    proxy_pass http://isureal_backend$request_uri;
  }

  # Routes that issue several sequential queries run next to the database on
  # asia1 with this region fixed by the listener. Login, logout, account and
  # profile changes stay local: they invalidate this host's session cache.
  location ~ ^/api/(?:posts(?:/[^/]+(?:/(?:comments|realmojis))?)?|users|friend-requests(?:/[^/]+/(?:accept|reject|cancel))?|(?:comments|realmojis|follows|blocks|friendships)/[^/]+)$ {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_pass http://isureal_regional_backend;
  }

  location /api/ {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_pass http://isureal_backend;
  }

  location / {
    try_files $uri /index.html;
  }
}
