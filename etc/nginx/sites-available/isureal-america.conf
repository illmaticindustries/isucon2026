upstream isureal_america_backend {
  server 192.168.1.10:8082;
  keepalive 32;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  # SSE: the app sends nothing until a notification is ready, so do not time out or buffer.
  location = /api/notifications {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_pass http://isureal_america_backend;
  }

  # Serve immutable image bytes from the local region app so this region's image
  # traffic does not cross regions to asia1. The app caches image metadata for a
  # few seconds, so hot images are served without a database round trip.
  location ^~ /api/images/ {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:8080;
  }

  location /api/ {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_pass http://isureal_america_backend;
  }

  location / {
    try_files $uri /index.html;
  }
}
