user www-data;
worker_processes auto;
pid /run/nginx.pid;
# SSE keeps client and upstream connections open; the default soft limit is 1024.
worker_rlimit_nofile 16384;
# Only serious errors; per-request/notice lines are pure log I/O during scoring.
error_log /var/log/nginx/error.log crit;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 4096;
	multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;

	# Drop timed-out connections without lingering; SSE reconnects churn sockets.
	reset_timedout_connection on;
	keepalive_requests 10000;

	# Cache stat/open results for the static bundle and immutable image files so
	# repeated reads skip syscalls. Errors are not cached, so a file that appears
	# later is still opened (the app's X-Accel-Redirect stat is authoritative).
	open_file_cache max=10000 inactive=30s;
	open_file_cache_valid 30s;
	open_file_cache_min_uses 2;
	open_file_cache_errors off;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	# alp 用。リモートアドレス・UA・リファラ等は出力しない
	log_format ltsv "time:$time_local"
		"\tmethod:$request_method"
		"\turi:$request_uri"
		"\tstatus:$status"
		"\tsize:$body_bytes_sent"
		"\treqtime:$request_time"
		"\tapptime:$upstream_response_time";

	access_log /var/log/nginx/access.log ltsv buffer=64k flush=1s;

	##
	# Gzip Settings
	##

	gzip on;

	# Keep image uploads in memory instead of a temp file before proxying.
	client_body_buffer_size 1m;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}


