name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    # Database integration tests are opt-in locally, never provision a DB in CI.
    env:
      ISUREAL_TEST_DB_DSN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        id: toolchain
        background: true
        with:
          go-version-file: webapp/go/go.mod
          cache-dependency-path: webapp/go/go.sum
      - name: Check deployment script syntax
        run: bash -n scripts/deploy-remote.sh && python3 -m py_compile scripts/deploy.py
      # setup-go publishes PATH only after the background step is joined.
      - wait: toolchain
      - name: Go vet
        id: vet
        background: true
        run: go vet ./...
        working-directory: webapp/go
      - name: Go unit tests (no database)
        id: tests
        background: true
        run: go test -vet=off ./...
        working-directory: webapp/go
      - name: Build Linux application
        id: build
        background: true
        run: go build -o /tmp/isureal ./cmd/isureal
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        working-directory: webapp/go
      # A failure in any background step must fail CI.
      - wait: [vet, tests, build]
