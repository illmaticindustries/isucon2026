name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: webapp/go/go.mod
          cache-dependency-path: webapp/go/go.sum
      - run: bash -n scripts/deploy-remote.sh && python3 -m py_compile scripts/deploy.py
      - run: python3 -m unittest discover -s tests -v
      - run: go vet ./... && go test ./... && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/isureal
        working-directory: webapp/go
