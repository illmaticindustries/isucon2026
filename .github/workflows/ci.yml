name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    # Database integration tests are opt-in locally, never provision a DB in CI.
    env:
      ISUREAL_TEST_DB_DSN: ''
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Go version
        id: go-version
        run: |
          version=$(awk '$1 == "go" {print $2; exit}' webapp/go/go.mod)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Go toolchain
        id: toolchain-cache
        background: true
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/go/${{ steps.go-version.outputs.version }}
          key: go-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-version.outputs.version }}
      - name: Cache Go compilation and modules
        id: build-cache
        background: true
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # Save changed sources after success, even when dependencies are unchanged.
          key: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-version.outputs.version }}-${{ hashFiles('webapp/go/go.mod', 'webapp/go/go.sum') }}-${{ hashFiles('webapp/go/**') }}
          restore-keys: |
            go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-version.outputs.version }}-${{ hashFiles('webapp/go/go.mod', 'webapp/go/go.sum') }}-
            go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-version.outputs.version }}-
      - name: Check deployment script syntax
        run: bash -n scripts/deploy-remote.sh && python3 -m py_compile scripts/deploy.py
      - wait: toolchain-cache
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache: false
      - wait: build-cache
      - name: Go vet
        id: vet
        background: true
        run: go vet ./...
        working-directory: webapp/go
      - name: Go unit tests (no database)
        id: tests
        background: true
        run: go test -vet=off ./...
        working-directory: webapp/go
      - name: Build Linux application
        id: build
        background: true
        run: go build -o /tmp/isureal ./cmd/isureal
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        working-directory: webapp/go
      # A failure in any background step must fail CI.
      - wait: [vet, tests, build]
